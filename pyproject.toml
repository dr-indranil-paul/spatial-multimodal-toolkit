[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-omics-toolkit"
version = "0.1.0"
description = "Guided Streamlit workflows for spatial imaging and omics data."
readme = "README.md"
authors = [
    { name = "Dr. Indranil Paul", email = "pauli@ohsu.edu" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "jsonschema>=4.0.0",
    "platformdirs>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "mypy",
]
scientific = [
    "anndata>=0.9.0",
    "spatialdata>=0.1.0",
    "scanpy>=1.9.0",
    "pyarrow>=12.0.0",
]
visium = [
    "spatialdata-io==0.6.0",
]
pathology = [
    "openslide-python==1.4.7",
    "openslide-bin==4.0.1.2",
]
flim = [
    "phasorpy>=0.12.0",
    "threadpoolctl>=3.1.0",
]
app = [
    "streamlit==1.54.0",
]
previews = [
    "pymupdf>=1.23.0",
]
imaging = [
    "opencv-python>=4.8.0",
    "tifffile>=2023.7.0",
    "scikit-image>=0.21.0",
    "aicspylibczi>=3.1.0",
    "nd2>=0.7.0",
]

[project.scripts]
spatial-omics = "spatial_omics_toolkit.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
